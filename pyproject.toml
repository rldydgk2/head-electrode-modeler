[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tetgen-head-model"
version = "0.1.0"
description = "Research-era head, tumor, and electrode geometry preparation for TetGen"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "tqdm>=4.65"]

[project.scripts]
head-model = "head_model.cli:main"

[tool.setuptools.packages.find]
include = ["head_model*"]
